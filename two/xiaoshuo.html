<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小说 - xiger</title>
    <link rel="stylesheet" href="../css/cssxs.css">
</head>
<body>
    <div class="topbar">
        <a class="back-link" href="../index.html">← 返回目录</a>
        <span class="page-tag">小说</span>
    </div>

    <header class="text-1">
        <h1 class="site-title">小说</h1>
        <p class="site-sub">阅读是个好习惯</p>
    </header>

    <main class="cards">
        <article class="card">
            <h2 class="card-title">《三体》</h2>
            <p class="card-desc">作者：刘慈欣</p>
            <p class="site-sub">毋庸置疑</p>
        </article>
        <article class="card">
            <h2 class="card-title">《恶意》</h2>
            <p class="card-desc">作者：东野圭吾</p>
            <p class="site-sub">我的悬疑小说入坑作，也是我对日本作家的第一印象，谢谢你东野圭吾先生。</p>
        </article>
        <article class="card">
            <h2 class="card-title">《龙族》</h2>
            <p class="card-desc">作者：江南（杨治）</p>
            <p class="site-sub">老贼速更！奇幻，青春文学，催更了一整个青春的神作，一个衰小孩的爽文罢了。</p>
        </article>
        <article class="card">
            <h2 class="card-title">《我的26岁女房客》</h2>
            <p class="card-desc">作者：超级大坦克科比（王金星）</p>
            <p class="site-sub">这是唯一一部让我难以言表的书，后来啊我去了江苏，那里没有天空之城，都是骗人的。</p>
        </article>
    </main>
</body>
</html>
