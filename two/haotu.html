    </main>

    <div class="lightbox" id="lightbox" tabindex="-1" hidden>
        <button class="lb-close" type="button" aria-label="关闭">×</button>
        <img class="lb-img" alt="">
        <div class="lb-bar">
            <a class="lb-download" href="#" download>下载原图</a>
        </div>
    </div>

    <script>
    (function () {
        var box = document.getElementById('lightbox');
        var big = box.querySelector('.lb-img');
        var link = box.querySelector('.lb-download');
        var closeBtn = box.querySelector('.lb-close');
        var lastFocus = null;

        function open(btn) {
            var full = btn.getAttribute('data-full');
            big.src = full;
            link.href = full;
            link.setAttribute('download', btn.getAttribute('data-name'));
            box.hidden = false;
            document.body.classList.add('lb-open');
            lastFocus = btn;
            box.focus();
        }

        function close() {
            box.hidden = true;
            document.body.classList.remove('lb-open');
            big.removeAttribute('src');
            if (lastFocus) {
                lastFocus.focus();
            }
        }

        Array.prototype.forEach.call(document.querySelectorAll('.pic'), function (btn) {
            btn.addEventListener('click', function () { open(btn); });
        });

        closeBtn.addEventListener('click', close);
        box.addEventListener('click', function (e) {
            if (e.target === box) {
                close();
            }
        });
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape' && !box.hidden) {
                close();
            }
        });
    }());
    </script>
</body>
</html>
