[build]
  publish = "."
  command = ""

# 图片等静态资源走长缓存
[[headers]]
  for = "/tu/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# 样式改得勤：不回长缓存，每次都用最新的，避免改完看不到
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
